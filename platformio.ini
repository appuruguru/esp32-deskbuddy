[platformio]
extra_configs = secrets.ini

[common]
ota_hostname = deskbuddy
ota_password = ${secrets.ota_password}

[env:cyd]
; Pinned: newer platform releases ship Arduino core 3, which removed ledcSetup/ledcAttachPin used here.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
; Two 1.9 MB app slots (default is 1.3 MB) for OTA headroom; no filesystem is used.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DOTA_HOSTNAME=\"${common.ota_hostname}\"
    -DOTA_PASSWORD=\"${common.ota_password}\"
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; Wireless uploads: pio run -e cyd_ota -t upload
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = ${common.ota_hostname}.local
upload_flags =
    --auth=${common.ota_password}
